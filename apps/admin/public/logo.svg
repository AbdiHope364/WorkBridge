<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <!-- Left Pillar Gradient (Navy) -->
    <linearGradient id="adminLeftGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Right Pillar Gradient (Teal/Cyan) -->
    <linearGradient id="adminRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Dynamic Arch Gradient (The Bridge Connector) -->
    <linearGradient id="adminArchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <!-- Energy Amber Dot Gradient -->
    <linearGradient id="adminAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Drop Shadow for floating depth -->
    <filter id="adminSoftShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- ==================== LOGOMARK ==================== -->
  <g transform="translate(15, 0)" filter="url(#adminSoftShadow)">
    <!-- Base Foundation Line -->
    <line x1="45" y1="185" x2="195" y2="185" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" />

    <!-- Left Pillar (First W Stroke) -->
    <path d="M 50 70 
             C 50 60, 62 55, 70 62 
             L 88 155 
             C 90 165, 102 165, 105 155 
             L 115 105 
             C 112 115, 96 178, 85 178 
             C 75 178, 50 85, 50 70 Z" 
          fill="url(#adminLeftGrad)" />

    <!-- Right Pillar (Final W Stroke) -->
    <path d="M 190 70 
             C 190 60, 178 55, 170 62 
             L 152 155 
             C 150 165, 138 165, 135 155 
             L 125 105 
             C 128 115, 144 178, 155 178 
             C 165 178, 190 85, 190 70 Z" 
          fill="url(#adminRightGrad)" />

    <!-- Upward Golden Keystone Node (The Center Pinnacle) -->
    <circle cx="120" cy="118" r="7.5" fill="url(#adminAmberGrad)" />

    <!-- Connecting Suspension Bridge Arch (Forming the central W truss) -->
    <path d="M 68 128 
             Q 120 40, 172 128" 
          fill="none" 
          stroke="url(#adminArchGrad)" 
          stroke-width="12" 
          stroke-linecap="round" />

    <!-- Subtle Arch Roadway Deck -->
    <path d="M 78 134 
             Q 120 62, 162 134" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="2.5" 
          stroke-dasharray="5 4" 
          stroke-linecap="round" 
          opacity="0.9" />
  </g>

  <!-- ==================== WORDMARK ==================== -->
  <g transform="translate(240, 0)">
    <!-- Primary Brand Name: WORK (Solid Slate Navy) -->
    <text x="0" y="125" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="#0F172A">WORK</text>

    <!-- Primary Brand Name: BRIDGE (Tech Cerulean Blue) -->
    <text x="215" y="125" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" 
          font-size="64" 
          font-weight="400" 
          letter-spacing="-0.5" 
          fill="#0284C7">BRIDGE</text>

    <!-- Accent Node Dot on the E -->
    <circle cx="478" cy="85" r="4.5" fill="#F59E0B" />

    <!-- Subtitle / Tagline -->
    <text x="3" y="162" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" 
          font-size="14.5" 
          font-weight="700" 
          letter-spacing="4.5" 
          fill="#64748B">SKILLED LABOR MARKETPLACE</text>

    <!-- Decorative Highlight Rule -->
    <rect x="3" y="176" width="62" height="3.5" rx="1.75" fill="#0284C7" />
  </g>
</svg>

